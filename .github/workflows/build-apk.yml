name: Build ChessMate AI APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - name: Build Stockfish for ARM64
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git /tmp/Stockfish
          cd /tmp/Stockfish/src
          make net
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make -j2 build ARCH=armv8 COMP=ndk
          make strip ARCH=armv8 COMP=ndk
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/assets/stockfish"
          cp ../LICENSE "$GITHUB_WORKSPACE/app/src/main/assets/stockfish-license.txt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ChessMateAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
